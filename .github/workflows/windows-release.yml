name: Xnarabi Windows release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for retrying a release build)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist:win -- --publish never
      - run: npm run test:sessions

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $files = @(Get-ChildItem outputs -Filter '*.exe' | Where-Object { $_.Name -match '^Xnarabi-(Portable|Setup)-' } | Sort-Object Name)
          if ($files.Count -ne 2) { throw "Expected two Windows executables, found $($files.Count)" }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -LiteralPath outputs/SHA256SUMS.txt -Encoding ascii

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: xnarabi-windows
          path: |
            outputs/Xnarabi-Portable-*.exe
            outputs/Xnarabi-Setup-*.exe
            outputs/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: xnarabi-windows
          path: outputs
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw "Invalid release tag: $tag" }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne "v$version") { throw "Tag $tag does not match package version $version" }
          $portable = "outputs/Xnarabi-Portable-$version-x64.exe"
          $setup = "outputs/Xnarabi-Setup-$version-x64.exe"
          $assets = @($portable, $setup, 'outputs/SHA256SUMS.txt')
          foreach ($asset in $assets) { if (-not (Test-Path -LiteralPath $asset)) { throw "Missing asset: $asset" } }
          $checksums = @(Get-Content -LiteralPath 'outputs/SHA256SUMS.txt')
          foreach ($asset in @($portable, $setup)) {
            $name = Split-Path -Leaf $asset
            $line = $checksums | Where-Object { $_ -match "^[a-f0-9]{64}  $([regex]::Escape($name))$" } | Select-Object -First 1
            $expected = if ($line) { $line.Substring(0, 64) } else { $null }
            if (-not $expected -or (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw "Checksum mismatch: $name" }
          }
          gh release create $tag $assets --repo $env:GITHUB_REPOSITORY --title "Xnarabi $tag" --notes-file .github/RELEASE_NOTES.md --verify-tag
